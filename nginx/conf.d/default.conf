server {
  # Port non-privileged: container berjalan sebagai user nginx, bukan root.
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Unggah PDF/EPUB hingga 25 MB (batas api) plus ruang untuk field form.
  client_max_body_size 30m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # YouTube embed, PDF via blob:, dan inline style React tetap diizinkan.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com blob:; media-src 'self' blob:; object-src 'self'; base-uri 'self'; form-action 'self'" always;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_redirect off;
  }

  # Aset build Vite memuat hash pada nama berkasnya, jadi cache agresif aman.
  # Hanya memakai expires: add_header di level location akan membatalkan
  # warisan header keamanan di atas.
  location /assets/ {
    expires 30d;
    try_files $uri =404;
  }

  location = /favicon.ico {
    try_files $uri =204;
  }

  # SPA: semua rute unknown kembali ke index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~ /\.(?!well-known) {
    deny all;
  }
}
